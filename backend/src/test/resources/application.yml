server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:tilldock;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

tilldock:
  security:
    jwt:
      secret: test-secret-key-must-be-at-least-256-bits-long-for-hs256-signing-algorithm-1234567890
      expiration-minutes: 60
    bcrypt:
      strength: 4