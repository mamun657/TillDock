server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: tilldock-auth
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

tilldock:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    bcrypt:
      strength: ${BCRYPT_STRENGTH:12}

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: WARN
    com.tilldock: INFO
    org.postgresql.util.PGPropertyUtil: OFF
    com.zaxxer.hikari: WARN